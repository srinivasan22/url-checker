<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fb" />
    <title>URL Check</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="app">
      <section class="checker" aria-labelledby="page-title">
        <div class="eyebrow"><span class="eyebrow-mark" aria-hidden="true"></span> URL CHECKER</div>
        <h1 id="page-title">Does this URL exist?</h1>
        <p class="intro">
          Enter a web address to check its format and look it up in our mock server.
        </p>

        <label for="url-input">URL to check</label>
        <div class="input-wrap">
          <span class="input-icon" aria-hidden="true">↗</span>
          <input
            id="url-input"
            type="url"
            inputmode="url"
            autocomplete="url"
            placeholder="https://example.com/docs/"
            aria-describedby="url-hint result"
            spellcheck="false"
          />
        </div>
        <p class="hint" id="url-hint">Include <code>https://</code> or <code>http://</code>.</p>

        <div class="result" id="result" role="status" aria-live="polite" hidden>
        </div>

        <div class="examples">
          <span class="examples-title">Try an example</span>
          <div class="example-list">
            <button type="button" data-url="https://example.com/">Home page</button>
            <button type="button" data-url="https://example.com/docs/">Folder</button>
            <button type="button" data-url="https://example.com/docs/guide.pdf">File</button>
            <button type="button" data-url="https://example.com/missing">Not found</button>
          </div>
        </div>

        <div class="note">
          <span aria-hidden="true">◉</span>
          Checks are simulated in your browser. No external requests are made.
        </div>
      </section>
    </main>
  </body>
</html>
